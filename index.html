<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useCallback } = React;

// ─── CONSTANTS ───
const RACE_DATE = new Date("2026-12-19");
const PROGRAM_START = new Date("2026-07-13");
const TOTAL_WEEKS = Math.ceil((RACE_DATE - PROGRAM_START) / (7 * 24 * 60 * 60 * 1000));

const PHASES = [
  { name: "Base", weeks: [1, 6], focus: "Build foundation, movement quality, aerobic base" },
  { name: "Build", weeks: [7, 14], focus: "Increase intensity, obstacle-specific strength" },
  { name: "Peak", weeks: [15, 19], focus: "Race simulation, high intensity, specificity" },
  { name: "Taper", weeks: [20, TOTAL_WEEKS], focus: "Reduce volume, maintain sharpness, recover" },
];

const getPhase = (week) => PHASES.find(p => week >= p.weeks[0] && week <= p.weeks[1]) || PHASES[0];
const isDeloadFn = (week) => week % 4 === 0;
const daysUntilRace = () => Math.max(0, Math.ceil((RACE_DATE - new Date()) / (1000 * 60 * 60 * 24)));
const getCurrentWeek = () => {
  const diff = new Date() - PROGRAM_START;
  return Math.max(1, Math.min(TOTAL_WEEKS, Math.ceil(diff / (7 * 24 * 60 * 60 * 1000))));
};

const weekDateRange = (week) => {
  const start = new Date(PROGRAM_START.getTime() + (week - 1) * 7 * 24 * 60 * 60 * 1000);
  const end = new Date(start.getTime() + 6 * 24 * 60 * 60 * 1000);
  const fmt = (d) => `${d.getMonth() + 1}/${d.getDate()}`;
  return `${fmt(start)} – ${fmt(end)}`;
};

// ─── DEFAULT ATHLETE ───
const DEFAULT_ATHLETE = {
  maxPullUps: 1,
  maxPushUps: 12,
  z2Pace: "11:45",
  calibratedWeights: {
    latPulldown: 110, facePull: 35, hammerCurl: 25, farmerCarry: 50,
    landminePress: null, dbBench: 45, tricepPushdown: 25, medBall: null,
    platePinch: 10, heavyFarmerCarry: null, gobletCarry: null, cableRopePull: null,
    dbRow: null, tgu: null, suitcaseCarry: null,
  },
};

// ─── CALIBRATION ───
const CALIBRATION_GROUPS = [
  { title: "Pull Day", exercises: [
    { key: "latPulldown", name: "Lat Pulldown (Close Grip)", hint: "10-12 rep working weight" },
    { key: "facePull", name: "Cable Face Pulls", hint: "15 rep working weight" },
    { key: "hammerCurl", name: "DB Hammer Curls", hint: "10-12 rep weight per DB" },
    { key: "farmerCarry", name: "Farmer Carry", hint: "Weight per hand" },
  ]},
  { title: "Push Day", exercises: [
    { key: "landminePress", name: "Landmine Press", hint: "8-10 rep working weight" },
    { key: "dbBench", name: "DB Bench Press", hint: "10-12 rep weight per DB" },
    { key: "tricepPushdown", name: "Tricep Rope Pushdown", hint: "12-15 rep working weight" },
    { key: "medBall", name: "Med Ball Rotational Slam", hint: "8 rep working weight" },
    { key: "platePinch", name: "Plate Pinch Hold", hint: "Weight per plate" },
  ]},
  { title: "Weekend / Obstacle", exercises: [
    { key: "heavyFarmerCarry", name: "Heavy DB Farmer Carry", hint: "Weight per hand — heavier than pull day" },
    { key: "gobletCarry", name: "Goblet Carry (KB/DB)", hint: "Single KB or DB at chest" },
    { key: "cableRopePull", name: "Cable Rope Hand-Over-Hand", hint: "Working weight" },
  ]},
  { title: "Travel / Hotel", exercises: [
    { key: "dbRow", name: "DB Rows (Single Arm)", hint: "10-12 rep weight per arm" },
    { key: "tgu", name: "Turkish Get-Up", hint: "Light DB or KB per side" },
    { key: "suitcaseCarry", name: "Suitcase Carry", hint: "Weight per hand" },
  ]},
];

// ─── EQUIPMENT ROUNDING ───
const EQUIPMENT_ROUNDING = {
  hammerCurl: 5, farmerCarry: 5, landminePress: 5, dbBench: 5, heavyFarmerCarry: 5,
  dbRow: 5, suitcaseCarry: 5,
  latPulldown: 5, facePull: 5, tricepPushdown: 5, cableRopePull: 5,
  gobletCarry: "kb", tgu: "kb",
  medBall: "medball", platePinch: "plate",
};
const KB_SIZES = [10,15,20,25,30,35,40,45,50,53,62,70,80,88,97,106];
const MEDBALL_SIZES = [6,8,10,12,14,16,20,25,30];
const PLATE_SIZES = [2.5,5,10,25,35,45];

const roundToNearest = (v, opts) => {
  let c = opts[0], m = Math.abs(v - c);
  for (const o of opts) { const d = Math.abs(v - o); if (d < m) { c = o; m = d; } }
  return c;
};

const calcWeight = (base, phase, deload, week, key) => {
  if (!base || base <= 0) return null;
  const prog = 1 + Math.floor((week - 1) / 4) * 0.025;
  const pm = phase.name === "Base" ? 0.85 : phase.name === "Build" ? 0.95 : phase.name === "Peak" ? 1.0 : 0.75;
  const dm = deload ? 0.7 : 1.0;
  const raw = base * prog * pm * dm;
  const r = EQUIPMENT_ROUNDING[key] || 5;
  if (r === "kb") return roundToNearest(raw, KB_SIZES);
  if (r === "medball") return roundToNearest(raw, MEDBALL_SIZES);
  if (r === "plate") return roundToNearest(raw, PLATE_SIZES);
  return Math.round(raw / r) * r;
};

const fw = (w) => w ? `${w} lbs` : null;

// ─── STORAGE ───
const loadState = () => {
  try {
    const raw = localStorage.getItem("spartan_beast_data");
    if (raw) return JSON.parse(raw);
  } catch(e) { console.error("Load error:", e); }
  return null;
};

const saveState = (state) => {
  try {
    localStorage.setItem("spartan_beast_data", JSON.stringify(state));
  } catch(e) { console.error("Save error:", e); }
};

// ─── EXERCISE LIBRARY ───
const pullUpProgression = (max) => {
  if (max < 1) return { name: "Pull-Up Negatives", sets: 4, reps: "5s lowering x 3-5", rest: "90s", rpe: 7, cue: "Jump to top, lower over 5 seconds. Control the descent.", regression: "Band-Assisted Negative", progression: "Slow to 8s lowering" };
  if (max < 3) return { name: "Pull-Up Singles + Negatives", sets: 5, reps: "1 pull-up + 2 negatives", rest: "2min", rpe: 8, cue: "Full dead hang start. Chin clears bar. Follow each rep with 2 slow negatives.", regression: "Band-Assisted Pull-Ups x 3-5", progression: "2 pull-ups + 1 negative" };
  if (max < 5) return { name: "Pull-Up Clusters", sets: 5, reps: `${Math.max(2, max-1)} reps`, rest: "2min", rpe: 8, cue: "Dead hang between each rep. Full range of motion.", regression: "Reduce to singles", progression: "Add 1 rep per set" };
  if (max < 8) return { name: "Pull-Ups", sets: 4, reps: `${Math.max(3, max-2)}-${max} reps`, rest: "90s", rpe: 7, cue: "Engage lats before pulling. No kipping.", regression: "Band-Assisted Pull-Ups", progression: "Add weight vest or slow tempo" };
  return { name: "Weighted Pull-Ups", sets: 4, reps: "5-6 reps", rest: "2min", rpe: 8, cue: "Add 5-10 lbs. Full ROM.", regression: "BW Pull-Ups x 8-10", progression: "Increase weight 5 lbs" };
};

const generateExercises = (dayType, week, phase, deload, equipment, athlete) => {
  const vm = deload ? 0.6 : 1;
  const mp = athlete.maxPullUps || 1;
  const mu = athlete.maxPushUps || 12;
  const fg = equipment === "full";
  const cw = athlete.calibratedWeights || {};
  const wt = (k) => fw(calcWeight(cw[k], phase, deload, week, k));

  const warmup = { name: "Warm-Up", sets: 1, reps: "5 min", rest: "-", rpe: 3,
    cue: "2 min light cardio → arm circles x 10 each way → band pull-aparts x 15 → cat-cow x 8 → dead bugs x 8/side → bodyweight squats x 10" };
  const cooldown = { name: "Cooldown & Mobility", sets: 1, reps: "5-8 min", rest: "-", rpe: 2,
    cue: "Foam roll lats & thoracic spine → doorway pec stretch 30s/side → pigeon stretch 30s/side → dead hang 20-30s → child's pose 1 min" };
  const ex = { warmup, cooldown };

  if (dayType === "pull") {
    const pu = pullUpProgression(mp);
    pu.sets = Math.round(pu.sets * vm);
    const main = [pu];
    if (fg) {
      main.push(
        { name: "Lat Pulldown (Close Grip)", sets: Math.round(3*vm), reps: "10-12", rest: "60s", rpe: 7, weightKey: "latPulldown", suggestedWeight: wt("latPulldown"), cue: "Lean back slightly. Squeeze lats at bottom. Slow eccentric.", regression: "Reduce weight 10%", progression: "Increase weight 5 lbs" },
        { name: "Cable Face Pulls", sets: Math.round(3*vm), reps: "15", rest: "45s", rpe: 6, weightKey: "facePull", suggestedWeight: wt("facePull"), cue: "Pull to forehead. Externally rotate at end. Great for shoulder health.", regression: "Band face pulls", progression: "Add pause at contraction" },
        { name: "Dumbbell Hammer Curls", sets: Math.round(3*vm), reps: "10-12/arm", rest: "45s", rpe: 7, weightKey: "hammerCurl", suggestedWeight: wt("hammerCurl"), cue: "Neutral grip builds forearm and grip strength for obstacles.", regression: "Lighter weight", progression: "Add 5 lbs" },
        { name: "Dead Hang", sets: Math.round(3*vm), reps: "Max hold", rest: "60s", rpe: 8, cue: "Overhand grip, shoulder-width. Relax shoulders, engage lats. Build to 60s holds.", regression: "Thicker bar or towel", progression: "Single arm assisted hangs" },
        { name: "Farmer Carry", sets: Math.round(3*vm), reps: "40m", rest: "60s", rpe: 7, weightKey: "farmerCarry", suggestedWeight: wt("farmerCarry") ? `${wt("farmerCarry")} /hand` : null, cue: "Heavy DBs, stand tall, shoulders packed. Simulates bucket carry.", regression: "Reduce weight", progression: "Increase distance or weight" }
      );
    } else {
      main.push(
        { name: "Towel Rows", sets: Math.round(3*vm), reps: "12-15", rest: "60s", rpe: 7, cue: "Lean back, pull chest to hands. Towel grip builds grip endurance.", regression: "More upright angle", progression: "Elevate feet" },
        { name: "Band Pull-Aparts", sets: Math.round(3*vm), reps: "20", rest: "30s", rpe: 6, cue: "Arms straight, pull band to chest level.", regression: "Lighter band", progression: "Heavier band or pause reps" },
        { name: "DB Rows (Single Arm)", sets: Math.round(3*vm), reps: "10-12/arm", rest: "45s", rpe: 7, weightKey: "dbRow", suggestedWeight: wt("dbRow"), cue: "Pull to hip. Squeeze at top.", regression: "Reduce weight", progression: "Pause at top 2s" },
        { name: "Dead Hang", sets: Math.round(3*vm), reps: "Max hold", rest: "60s", rpe: 8, cue: "Any safe overhead hang point. Build grip endurance.", regression: "Flexed arm hang", progression: "Towel hang" },
        { name: "Backpack Carry", sets: Math.round(3*vm), reps: "3 min walk", rest: "60s", rpe: 7, cue: "Load backpack with books/bottles. Walk with good posture.", regression: "Reduce load", progression: "Increase time or load" }
      );
    }
    ex.main = main;

  } else if (dayType === "run") {
    const r = [];
    if (phase.name === "Base") r.push({ name: "Easy Run (Zone 2)", sets: 1, reps: deload ? "20 min" : "30 min", rest: "-", rpe: 5, cue: `Conversational pace ~${athlete.z2Pace}/mi. Nasal breathing. Build aerobic base.`, regression: "Walk/run intervals 2:1", progression: "Add 5 min" });
    else if (phase.name === "Build") r.push({ name: "Tempo Intervals", sets: 1, reps: deload ? "20 min" : "30 min total", rest: "-", rpe: 7, cue: "10 min warm-up → 4x3 min at tempo (9:00/mi) w/ 2 min easy → 5 min cooldown.", regression: "3x3 min tempo", progression: "5x3 min or 4 min intervals" });
    else if (phase.name === "Peak") r.push({ name: "Hill Repeats", sets: 1, reps: deload ? "25 min" : "35 min", rest: "-", rpe: 8, cue: "10 min warm-up → 6x2 min at 5-8% grade, hard, 2 min easy → cooldown.", regression: "4x2 min", progression: "8x2 min or increase grade" });
    else r.push({ name: "Easy Shakeout Run", sets: 1, reps: "20-25 min", rest: "-", rpe: 4, cue: "Very easy. Stay relaxed. Trust the training.", regression: "Walk/jog", progression: "Keep easy" });
    r.push(
      { name: "Dead Bugs", sets: 3, reps: "10/side", rest: "30s", rpe: 5, cue: "Press low back into floor. Opposite arm/leg extend. Spine-safe.", regression: "Reduce ROM", progression: "Add ankle weights" },
      { name: "Pallof Press", sets: 3, reps: "10/side", rest: "30s", rpe: 6, cue: fg ? "Cable at chest height. Press out, resist rotation." : "Band anchored. Press and hold.", regression: "Lighter resistance", progression: "Add 2s hold" },
      { name: "Side Plank", sets: 2, reps: "30s/side", rest: "30s", rpe: 6, cue: "Stack hips. No rotation. Build to 45s.", regression: "Knee down", progression: "Add hip dips x 8" },
      { name: "Bird Dogs", sets: 3, reps: "8/side", rest: "30s", rpe: 5, cue: "Opposite arm/leg extend. 2s hold at top.", regression: "Arm or leg only", progression: "Add band" }
    );
    ex.main = r;

  } else if (dayType === "push") {
    const pt = Math.min(Math.round(mu * (phase.name==="Base"?0.85:phase.name==="Build"?0.95:1.0)), deload ? Math.round(mu*0.6) : mu+2);
    const main = [{ name: "Push-Ups", sets: Math.round(4*vm), reps: `${pt}`, rest: "60s", rpe: 7, cue: "Full lockout. Chest to fist-height from floor.", regression: "Incline push-ups", progression: "Deficit or add weight vest" }];
    if (fg) {
      main.push(
        { name: "Landmine Press", sets: Math.round(3*vm), reps: "8-10/arm", rest: "90s", rpe: 7, weightKey: "landminePress", suggestedWeight: wt("landminePress"), cue: "Single arm, staggered stance. Press at angle — overhead stimulus without full shoulder demand.", regression: "High incline DB press (60°)", progression: "Increase weight 5 lbs" },
        { name: "DB Bench Press", sets: Math.round(3*vm), reps: "10-12", rest: "60s", rpe: 7, weightKey: "dbBench", suggestedWeight: wt("dbBench") ? `${wt("dbBench")} /hand` : null, cue: "Neutral grip. Control descent. Shoulder-friendly path.", regression: "Floor press", progression: "Incline DB press" },
        { name: "Tricep Rope Pushdown", sets: Math.round(3*vm), reps: "12-15", rest: "45s", rpe: 6, weightKey: "tricepPushdown", suggestedWeight: wt("tricepPushdown"), cue: "Elbows pinned. Full lockout.", regression: "Lighter weight", progression: "Add pause at bottom" },
        { name: "Plate Pinch Hold", sets: Math.round(3*vm), reps: "30s hold", rest: "45s", rpe: 7, weightKey: "platePinch", suggestedWeight: wt("platePinch") ? `${wt("platePinch")} /plate` : null, cue: "Pinch two plates together. Builds finger/grip strength.", regression: "Single plate", progression: "Heavier plates or longer hold" },
        { name: "Med Ball Rotational Slam", sets: Math.round(3*vm), reps: "8/side", rest: "45s", rpe: 7, weightKey: "medBall", suggestedWeight: wt("medBall"), cue: "Rotate from hips, slam diagonally. Spear throw prep.", regression: "Cable woodchop", progression: "Heavier ball" }
      );
    } else {
      main.push(
        { name: "Pike Push-Ups", sets: Math.round(3*vm), reps: "8-10", rest: "60s", rpe: 7, cue: "Hips high, press overhead angle.", regression: "Hands on chair", progression: "Feet elevated" },
        { name: "Diamond Push-Ups", sets: Math.round(3*vm), reps: "8-12", rest: "60s", rpe: 7, cue: "Hands close. Tricep emphasis.", regression: "From knees", progression: "Slow tempo 3-1-3" },
        { name: "Tricep Dips (Chair)", sets: Math.round(3*vm), reps: "12-15", rest: "45s", rpe: 6, cue: "Hands on sturdy chair. Don't go too deep if shoulder hurts.", regression: "Bend knees more", progression: "Legs straight, feet elevated" },
        { name: "Towel Wring + Grip Squeeze", sets: Math.round(3*vm), reps: "30s each", rest: "30s", rpe: 6, cue: "Wring wet towel. Then grip squeeze a rolled towel.", regression: "Shorter duration", progression: "Thicker towel" },
        { name: "Bodyweight Woodchops", sets: Math.round(3*vm), reps: "10/side", rest: "45s", rpe: 7, cue: "Rotate from hips with control.", regression: "Slow, no resistance", progression: "Add band" }
      );
    }
    ex.main = main;

  } else if (dayType === "long") {
    let mins;
    if (phase.name==="Base") mins = deload ? 40 : 50+(week-1)*5;
    else if (phase.name==="Build") mins = deload ? 50 : 65+((week-7)*5);
    else if (phase.name==="Peak") mins = deload ? 50 : 80+((week-15)*5);
    else mins = 40;
    mins = Math.min(mins, 120);
    const main = [{ name: "Long Run (Obstacle Stops)", sets: 1, reps: `${mins} min`, rest: "-", rpe: phase.name==="Peak"?7:6, cue: "Zone 2 (~11:45/mi). Every 15 min stop for 30s drill (burpees, bear crawls, or carry).", regression: "Walk/run intervals", progression: "Add hills or negative split" }];
    if (fg) {
      main.push(
        { name: "Heavy DB Farmer Carry", sets: 4, reps: "60m", rest: "90s", rpe: 8, weightKey: "heavyFarmerCarry", suggestedWeight: wt("heavyFarmerCarry") ? `${wt("heavyFarmerCarry")} /hand` : null, cue: "Heaviest DBs you can manage. Stay tall.", regression: "Lighter, shorter", progression: "Increase weight or distance" },
        { name: "Towel Pull-Ups", sets: 3, reps: "6-8", rest: "90s", rpe: 8, cue: "Drape towel over bar. Grip towel ends. Rope climb prep.", regression: "Regular pull-ups", progression: "Weighted towel pull-ups" },
        { name: "Box Jumps → Burpee Complex", sets: deload?2:4, reps: "5 jumps + 5 burpees", rest: "90s", rpe: 8, cue: "Explosive jump up, step down. Immediate burpees. Wall climb + penalty sim.", regression: "Step-ups + half burpees", progression: "Higher box" },
        { name: "Bear Crawl → Army Crawl", sets: deload?2:3, reps: "20m + 10m", rest: "60s", rpe: 7, cue: "Bear crawl forward, drop to army. Barbed wire sim.", regression: "Shorter distance", progression: "Add weight vest" },
        { name: "Goblet Carry (Heavy KB/DB)", sets: 3, reps: "40m", rest: "60s", rpe: 7, weightKey: "gobletCarry", suggestedWeight: wt("gobletCarry"), cue: "Hold at chest. Walk with purpose.", regression: "Lighter weight", progression: "Increase distance" },
        { name: "Cable Rope Hand-Over-Hand", sets: 3, reps: "10 pulls", rest: "60s", rpe: 7, weightKey: "cableRopePull", suggestedWeight: wt("cableRopePull"), cue: "Seated, pull hand over hand. Hercules hoist sim.", regression: "Lighter weight", progression: "Heavier, longer pulls" }
      );
    }
    ex.main = main;

  } else if (dayType === "bonus") {
    ex.main = [
      { name: "Easy Run or Swim", sets: 1, reps: "20-30 min", rest: "-", rpe: 5, cue: "Recovery pace. Pool great for shoulders and low back.", regression: "Walk 30 min", progression: "Light tempo last 5 min" },
      { name: "Pull-Up Greasing the Groove", sets: 5, reps: "50% max, spread out", rest: "As needed", rpe: 5, cue: "Submaximal sets. Never to failure.", regression: "Band-assisted", progression: "Increase frequency" },
      { name: "Turkish Get-Up", sets: 2, reps: "3/side", rest: "60s", rpe: 6, weightKey: "tgu", suggestedWeight: wt("tgu"), cue: "Light DB/KB. Full body stability.", regression: "Half get-up", progression: "Add 5 lbs" },
      { name: "Suitcase Carry", sets: 3, reps: "30m/side", rest: "45s", rpe: 6, weightKey: "suitcaseCarry", suggestedWeight: wt("suitcaseCarry"), cue: "Single heavy DB. Anti-lateral flexion.", regression: "Lighter", progression: "Heavier or longer" }
    ];
  }
  return ex;
};

const SCHEDULE = [
  { day: "Day 1 (Weekday)", type: "pull", label: "Upper Pull + Grip" },
  { day: "Day 2 (Weekday)", type: "run", label: "Run + Core" },
  { day: "Day 3 (Weekday)", type: "push", label: "Upper Push + Grip" },
  { day: "Day 4 (Weekend)", type: "long", label: "Long Run + Obstacle Sim" },
];

const SKIP_REASONS = [
  { key: "travel", label: "Travel", icon: "✈️" },
  { key: "tired", label: "Tired / Recovery", icon: "😴" },
  { key: "pain", label: "Pain / Injury", icon: "🩹" },
  { key: "life", label: "Life Happened", icon: "🤷" },
];

// ─── COLORS ───
const C = {
  bg: "#0f1117", sf: "#1a1d27", ac: "#e8552e", ag: "rgba(232,85,46,0.15)",
  gn: "#3ddc84", gd: "rgba(61,220,132,0.15)",
  yl: "#fbbf24", yd: "rgba(251,191,36,0.15)",
  bl: "#60a5fa", bd: "rgba(96,165,250,0.15)",
  tx: "#e8e6e1", td: "#8a8d98", br: "#2a2d3a", dn: "#ef4444",
};

// ─── APP ───
function App() {
  const [state, setState] = useState(() => {
    const saved = loadState();
    return saved || {
      athleteData: { ...DEFAULT_ATHLETE },
      completedWorkouts: {},
      skippedWorkouts: {},
      weeklyLogs: {},
      equipmentMode: "full",
    };
  });

  const [view, setView] = useState("today");
  const [activeWorkout, setActiveWorkout] = useState(null);
  const [logEntries, setLogEntries] = useState({});
  const [workoutNotes, setWorkoutNotes] = useState("");
  const [showBonus, setShowBonus] = useState(false);
  const [selectedWeek, setSelectedWeek] = useState(getCurrentWeek());
  const [completedToday, setCompletedToday] = useState(null);
  const [showSkipFor, setShowSkipFor] = useState(null);
  const [calibrationWeights, setCalibrationWeights] = useState({});
  const [saveConfirm, setSaveConfirm] = useState(null);

  // Save on every state change
  useEffect(() => { saveState(state); }, [state]);

  const week = selectedWeek || getCurrentWeek();
  const phase = getPhase(week);
  const deload = isDeloadFn(week);
  const eq = state.equipmentMode || "full";

  const setEq = (m) => setState(s => ({ ...s, equipmentMode: m }));

  const getWorkout = useCallback((di, wk) => {
    const s = SCHEDULE[di];
    if (!s) return null;
    return { ...s, exercises: generateExercises(s.type, wk, getPhase(wk), isDeloadFn(wk), eq, state.athleteData), week: wk, equipment: eq };
  }, [eq, state.athleteData]);

  const startWorkout = (di) => {
    setActiveWorkout({ ...getWorkout(di, week), dayIndex: di });
    setLogEntries({});
    setWorkoutNotes("");
    setView("log");
  };

  const startBonus = () => {
    const exercises = generateExercises("bonus", week, phase, deload, eq, state.athleteData);
    setActiveWorkout({ day: "Bonus", type: "bonus", label: "Bonus Recovery + Skill", exercises, week, dayIndex: "bonus", equipment: eq });
    setLogEntries({}); setWorkoutNotes(""); setShowBonus(false); setView("log");
  };

  const updateLog = (i, f, v) => setLogEntries(p => ({ ...p, [i]: { ...(p[i]||{}), [f]: v } }));

  const completeWorkout = () => {
    if (!activeWorkout) return;
    const lk = `w${week}-d${activeWorkout.dayIndex}`;
    const newAthlete = { ...state.athleteData };
    const newCW = { ...(newAthlete.calibratedWeights || {}) };

    Object.entries(logEntries).forEach(([idx, entry]) => {
      const ex = activeWorkout.exercises.main[parseInt(idx)];
      if (!ex) return;
      // Adapt pull-ups
      if (ex.name.toLowerCase().includes("pull-up") && !ex.name.toLowerCase().includes("lat") && !ex.name.toLowerCase().includes("towel") && !ex.name.toLowerCase().includes("face")) {
        if (entry.actualReps && entry.rpe) {
          const reps = parseInt(entry.actualReps), rpe = parseInt(entry.rpe);
          if (reps > 0 && rpe <= 7) newAthlete.maxPullUps = Math.max(newAthlete.maxPullUps, reps + 1);
          else if (reps > 0) newAthlete.maxPullUps = Math.max(newAthlete.maxPullUps, reps);
        }
      }
      // Adapt push-ups
      if (ex.name.toLowerCase() === "push-ups") {
        if (entry.actualReps && entry.rpe) {
          const reps = parseInt(entry.actualReps), rpe = parseInt(entry.rpe);
          if (reps > 0 && rpe <= 7) newAthlete.maxPushUps = Math.max(newAthlete.maxPushUps, reps + 2);
          else if (reps > 0) newAthlete.maxPushUps = Math.max(newAthlete.maxPushUps, reps);
        }
      }
      // Adapt weights
      if (ex.weightKey && entry.weight && entry.rpe) {
        const lw = parseFloat(entry.weight), rpe = parseInt(entry.rpe);
        if (!isNaN(lw) && lw > 0 && rpe) {
          if (rpe <= 6 && ex.rpe >= 7) newCW[ex.weightKey] = Math.round((lw * 1.05) / 5) * 5;
          else if (rpe >= 9) newCW[ex.weightKey] = Math.round((lw * 0.9) / 5) * 5;
          else if (!newCW[ex.weightKey]) newCW[ex.weightKey] = lw;
        }
      }
    });

    newAthlete.calibratedWeights = newCW;
    setState(s => ({
      ...s, athleteData: newAthlete,
      completedWorkouts: { ...s.completedWorkouts, [lk]: true },
      weeklyLogs: { ...s.weeklyLogs, [lk]: { entries: logEntries, notes: workoutNotes, date: new Date().toISOString(), type: activeWorkout.type } },
    }));
    setCompletedToday(activeWorkout.label);
    setActiveWorkout(null); setView("today");
  };

  const skipWorkout = (di, reason) => {
    const lk = `w${week}-d${di}`;
    setState(s => ({ ...s, skippedWorkouts: { ...s.skippedWorkouts, [lk]: { reason, date: new Date().toISOString() } } }));
    setShowSkipFor(null);
  };

  const saveCal = () => {
    const cleaned = {};
    Object.entries(calibrationWeights).forEach(([k,v]) => { if (v !== "" && v !== null && !isNaN(v) && v > 0) cleaned[k] = parseFloat(v); });
    setState(s => ({
      ...s, athleteData: { ...s.athleteData, calibratedWeights: { ...s.athleteData.calibratedWeights, ...cleaned } }
    }));
    setSaveConfirm("saved");
    setTimeout(() => { setSaveConfirm(null); setView("today"); }, 1000);
  };

  // Shared styles
  const card = { background: C.sf, borderRadius: 10, padding: "14px 16px", marginBottom: 8, border: `1px solid ${C.br}` };
  const btn = { border: "none", cursor: "pointer", borderRadius: 6, fontSize: 14 };
  const lbl = { fontSize: 10, color: C.td, textTransform: "uppercase", letterSpacing: 0.5, display: "block" };
  const inp = { background: C.bg, border: `1px solid ${C.br}`, borderRadius: 6, color: C.tx, padding: "8px 10px", fontSize: 13, width: "100%", boxSizing: "border-box", marginTop: 4, outline: "none", fontFamily: "inherit" };

  // ─── CALIBRATE VIEW ───
  if (view === "calibrate") {
    return (
      <div style={{ padding: 16, maxWidth: 600, margin: "0 auto" }}>
        <button onClick={() => setView("today")} style={{ ...btn, background: "transparent", color: C.td, padding: "8px 0", marginBottom: 12, fontSize: 13 }}>← Dashboard</button>
        <div style={{ background: C.ac, color: "#fff", borderRadius: 8, padding: "14px 16px", marginBottom: 16 }}>
          <div style={{ fontSize: 18, fontWeight: 700 }}>Calibrate Your Weights</div>
          <div style={{ fontSize: 12, marginTop: 4, opacity: 0.85 }}>Enter your comfortable working weight (RPE 7, 2-3 reps in reserve). The program adjusts from here based on phase and your logged performance.</div>
        </div>
        {CALIBRATION_GROUPS.map((g, gi) => (
          <div key={gi} style={{ marginBottom: 16 }}>
            <div style={{ fontSize: 13, fontWeight: 700, color: C.ac, textTransform: "uppercase", letterSpacing: 1, marginBottom: 8 }}>{g.title}</div>
            {g.exercises.map(e => {
              const cv = calibrationWeights[e.key] ?? state.athleteData.calibratedWeights?.[e.key] ?? "";
              return (
                <div key={e.key} style={{ ...card, display: "flex", alignItems: "center", gap: 12 }}>
                  <div style={{ flex: 1 }}>
                    <div style={{ fontSize: 14, fontWeight: 600 }}>{e.name}</div>
                    <div style={{ fontSize: 11, color: C.td, marginTop: 2 }}>{e.hint}</div>
                  </div>
                  <div style={{ display: "flex", alignItems: "center", gap: 6, minWidth: 100 }}>
                    <input type="number" placeholder="—" value={cv} onChange={ev => setCalibrationWeights(p => ({ ...p, [e.key]: ev.target.value }))}
                      style={{ ...inp, width: 65, textAlign: "center", marginTop: 0 }} />
                    <span style={{ fontSize: 12, color: C.td }}>lbs</span>
                  </div>
                </div>
              );
            })}
          </div>
        ))}
        <div style={{ fontSize: 12, color: C.td, marginBottom: 12, lineHeight: 1.6 }}>Start conservative — weights auto-adjust based on your RPE after each session.</div>
        {saveConfirm === "saved" && <div style={{ background: C.gd, border: `1px solid ${C.gn}33`, borderRadius: 8, padding: "12px", marginBottom: 12, fontSize: 14, color: C.gn, fontWeight: 700, textAlign: "center" }}>✓ Weights Saved</div>}
        <button onClick={saveCal} style={{ ...btn, background: C.gn, color: "#000", fontWeight: 700, width: "100%", padding: 14, fontSize: 15, marginBottom: 32, borderRadius: 8 }}>Save Weights</button>
      </div>
    );
  }

  // ─── LOG VIEW ───
  if (view === "log" && activeWorkout) {
    return (
      <div style={{ padding: 16, maxWidth: 600, margin: "0 auto" }}>
        <button onClick={() => { setActiveWorkout(null); setView("today"); }} style={{ ...btn, background: "transparent", color: C.td, padding: "8px 0", marginBottom: 12, fontSize: 13 }}>← Back</button>
        <div style={{ background: C.ac, color: "#fff", borderRadius: 8, padding: "12px 16px", marginBottom: 16 }}>
          <div style={{ fontSize: 11, textTransform: "uppercase", letterSpacing: 1, opacity: 0.8 }}>Week {week} · {weekDateRange(week)} · {phase.name}{deload ? " · Deload" : ""}</div>
          <div style={{ fontSize: 20, fontWeight: 700, marginTop: 4 }}>{activeWorkout.label}</div>
          <div style={{ fontSize: 11, marginTop: 4, opacity: 0.8 }}>{activeWorkout.equipment === "full" ? "🏋️ Full Gym" : "✈️ Hotel / BW"}</div>
        </div>

        <div style={{ ...card, borderLeft: `3px solid ${C.yl}` }}>
          <div style={{ fontSize: 14, fontWeight: 600, color: C.yl }}>{activeWorkout.exercises.warmup.name}</div>
          <div style={{ fontSize: 12, color: C.td, marginTop: 4 }}>{activeWorkout.exercises.warmup.cue}</div>
        </div>

        {activeWorkout.exercises.main.map((ex, i) => {
          const isRun = ex.name.toLowerCase().includes("run") || ex.name.toLowerCase().includes("tempo") || ex.name.toLowerCase().includes("hill") || ex.name.toLowerCase().includes("shakeout");
          const done = isRun ? logEntries[i]?.distance : logEntries[i]?.actualReps;
          return (
            <div key={i} style={{ ...card, borderLeft: `3px solid ${done ? C.gn : C.br}` }}>
              <div style={{ display: "flex", justifyContent: "space-between" }}>
                <div style={{ fontSize: 15, fontWeight: 600, flex: 1 }}>{ex.name}</div>
                <div style={{ fontSize: 11, color: C.ac, fontWeight: 600 }}>RPE {ex.rpe}</div>
              </div>
              {ex.suggestedWeight && <div style={{ display: "inline-block", background: C.bd, border: `1px solid ${C.bl}44`, borderRadius: 5, padding: "3px 8px", marginTop: 6, fontSize: 12, fontWeight: 700, color: C.bl }}>⟶ {ex.suggestedWeight}</div>}
              <div style={{ display: "flex", gap: 16, marginTop: 6, fontSize: 12, color: C.td }}><span>{ex.sets} sets</span><span>{ex.reps}</span><span>Rest: {ex.rest}</span></div>
              <div style={{ fontSize: 12, color: C.td, marginTop: 6, lineHeight: 1.5, fontStyle: "italic" }}>{ex.cue}</div>
              <div style={{ fontSize: 11, color: C.td, marginTop: 4 }}><span style={{ color: C.gn }}>↑ {ex.progression}</span> · <span style={{ color: C.yl }}>↓ {ex.regression}</span></div>
              {isRun ? (
                <div style={{ marginTop: 10 }}>
                  <div style={{ fontSize: 11, color: C.ac, fontWeight: 600, marginBottom: 6, textTransform: "uppercase" }}>Run Metrics</div>
                  <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
                    <div style={{ flex: 1, minWidth: 70 }}><label style={lbl}>Dist (mi)</label><input type="text" placeholder="3.1" value={logEntries[i]?.distance||""} onChange={e=>updateLog(i,"distance",e.target.value)} style={inp}/></div>
                    <div style={{ flex: 1, minWidth: 70 }}><label style={lbl}>Time</label><input type="text" placeholder="30:00" value={logEntries[i]?.time||""} onChange={e=>updateLog(i,"time",e.target.value)} style={inp}/></div>
                    <div style={{ flex: 1, minWidth: 70 }}><label style={lbl}>Avg Pace</label><input type="text" placeholder="9:41/mi" value={logEntries[i]?.avgPace||""} onChange={e=>updateLog(i,"avgPace",e.target.value)} style={inp}/></div>
                  </div>
                  <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginTop: 6 }}>
                    <div style={{ flex: 1, minWidth: 70 }}><label style={lbl}>Avg HR</label><input type="text" placeholder="145" value={logEntries[i]?.avgHR||""} onChange={e=>updateLog(i,"avgHR",e.target.value)} style={inp}/></div>
                    <div style={{ flex: 1, minWidth: 70 }}><label style={lbl}>Elev (ft)</label><input type="text" placeholder="120" value={logEntries[i]?.elevation||""} onChange={e=>updateLog(i,"elevation",e.target.value)} style={inp}/></div>
                    <div style={{ flex: 1, minWidth: 70 }}><label style={lbl}>RPE</label><input type="number" min="1" max="10" placeholder="6" value={logEntries[i]?.rpe||""} onChange={e=>updateLog(i,"rpe",e.target.value)} style={inp}/></div>
                  </div>
                </div>
              ) : (
                <div style={{ display: "flex", gap: 8, marginTop: 10, flexWrap: "wrap" }}>
                  <div style={{ flex: 1, minWidth: 80 }}><label style={lbl}>Actual Reps</label><input type="text" placeholder="e.g. 8" value={logEntries[i]?.actualReps||""} onChange={e=>updateLog(i,"actualReps",e.target.value)} style={inp}/></div>
                  <div style={{ flex: 1, minWidth: 80 }}><label style={lbl}>Weight (lbs)</label><input type="text" placeholder={ex.suggestedWeight||"e.g. 50"} value={logEntries[i]?.weight||""} onChange={e=>updateLog(i,"weight",e.target.value)} style={inp}/></div>
                  <div style={{ flex: 1, minWidth: 80 }}><label style={lbl}>RPE (1-10)</label><input type="number" min="1" max="10" placeholder="7" value={logEntries[i]?.rpe||""} onChange={e=>updateLog(i,"rpe",e.target.value)} style={inp}/></div>
                </div>
              )}
            </div>
          );
        })}

        <div style={{ ...card, borderLeft: `3px solid ${C.yl}` }}>
          <div style={{ fontSize: 14, fontWeight: 600, color: C.yl }}>{activeWorkout.exercises.cooldown.name}</div>
          <div style={{ fontSize: 12, color: C.td, marginTop: 4 }}>{activeWorkout.exercises.cooldown.cue}</div>
        </div>
        <div style={card}>
          <label style={{ fontSize: 12, fontWeight: 600, display: "block", marginBottom: 6 }}>Session Notes</label>
          <textarea rows={3} placeholder="How did you feel? Any pain?" value={workoutNotes} onChange={e=>setWorkoutNotes(e.target.value)} style={{ ...inp, width: "100%", resize: "vertical" }}/>
        </div>
        <button onClick={completeWorkout} style={{ ...btn, background: C.gn, color: "#000", fontWeight: 700, width: "100%", padding: 14, fontSize: 15, marginBottom: 32, borderRadius: 8 }}>Complete Workout ✓</button>
      </div>
    );
  }

  // ─── WEEK VIEW ───
  if (view === "week") {
    return (
      <div style={{ padding: 16, maxWidth: 600, margin: "0 auto" }}>
        <button onClick={() => setView("today")} style={{ ...btn, background: "transparent", color: C.td, padding: "8px 0", marginBottom: 12, fontSize: 13 }}>← Dashboard</button>
        <div style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 16 }}>
          <button onClick={() => setSelectedWeek(Math.max(1, week-1))} style={{ ...btn, background: C.sf, color: C.tx, padding: "8px 12px", borderRadius: 6 }}>◀</button>
          <div style={{ flex: 1, textAlign: "center" }}>
            <div style={{ fontSize: 20, fontWeight: 700 }}>Week {week}</div>
            <div style={{ fontSize: 12, color: C.ac }}>{phase.name} Phase{deload ? " · DELOAD" : ""}</div>
            <div style={{ fontSize: 11, color: C.td, marginTop: 2 }}>{weekDateRange(week)}</div>
          </div>
          <button onClick={() => setSelectedWeek(Math.min(TOTAL_WEEKS, week+1))} style={{ ...btn, background: C.sf, color: C.tx, padding: "8px 12px", borderRadius: 6 }}>▶</button>
        </div>
        <div style={{ fontSize: 12, color: C.td, textAlign: "center", marginBottom: 14 }}>{phase.focus}</div>
        <div style={{ background: C.bg, borderRadius: 8, padding: 4, marginBottom: 16, display: "flex", border: `1px solid ${C.br}` }}>
          <button onClick={() => setEq("full")} style={{ ...btn, flex: 1, padding: 10, borderRadius: 6, fontSize: 13, fontWeight: 600, background: eq==="full"?C.ac:"transparent", color: eq==="full"?"#fff":C.td }}>🏋️ Full Gym</button>
          <button onClick={() => setEq("minimal")} style={{ ...btn, flex: 1, padding: 10, borderRadius: 6, fontSize: 13, fontWeight: 600, background: eq==="minimal"?C.ac:"transparent", color: eq==="minimal"?"#fff":C.td }}>✈️ Hotel / BW</button>
        </div>

        {SCHEDULE.map((s, i) => {
          const lk = `w${week}-d${i}`;
          const done = state.completedWorkouts[lk];
          const skip = state.skippedWorkouts?.[lk];
          const wo = getWorkout(i, week);
          return (
            <div key={i} style={{ ...card, borderLeft: `3px solid ${done?C.gn:skip?C.td:C.ac}`, opacity: skip?0.7:1 }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                <div style={{ flex: 1, cursor: !done&&!skip?"pointer":"default" }} onClick={() => !done&&!skip&&startWorkout(i)}>
                  <div style={{ fontSize: 14, fontWeight: 600 }}>{s.label}</div>
                  <div style={{ fontSize: 11, color: C.td, marginTop: 2 }}>{s.day} · {eq==="full"?"Full Gym":"Travel"}</div>
                </div>
                {done ? <span style={{ fontSize: 11, color: C.gn, fontWeight: 600, background: C.gd, padding: "4px 8px", borderRadius: 4 }}>DONE</span>
                : skip ? <span style={{ fontSize: 11, color: C.td, background: C.sf, padding: "4px 8px", borderRadius: 4 }}>SKIPPED {skip.reason==="travel"?"✈️":skip.reason==="tired"?"😴":skip.reason==="pain"?"🩹":"🤷"}</span>
                : <div style={{ display: "flex", gap: 6 }}>
                    <span style={{ fontSize: 11, color: C.ac, fontWeight: 600, cursor: "pointer" }} onClick={() => startWorkout(i)}>START →</span>
                    <span style={{ fontSize: 11, color: C.td, cursor: "pointer" }} onClick={e => { e.stopPropagation(); setShowSkipFor(i); }}>Skip</span>
                  </div>}
              </div>
              {showSkipFor === i && <div style={{ marginTop: 10, padding: 10, background: C.bg, borderRadius: 8, border: `1px solid ${C.br}` }}>
                <div style={{ fontSize: 12, fontWeight: 600, marginBottom: 8 }}>Why?</div>
                <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
                  {SKIP_REASONS.map(r => <button key={r.key} onClick={() => skipWorkout(i, r.key)} style={{ ...btn, background: C.sf, color: C.tx, padding: "8px 12px", borderRadius: 6, fontSize: 12, border: `1px solid ${C.br}` }}>{r.icon} {r.label}</button>)}
                </div>
                <button onClick={() => setShowSkipFor(null)} style={{ ...btn, background: "transparent", color: C.td, fontSize: 11, marginTop: 6 }}>Cancel</button>
              </div>}
              {!skip && wo && <div style={{ marginTop: 8, fontSize: 12, color: C.td, cursor: !done?"pointer":"default" }} onClick={() => !done&&startWorkout(i)}>
                {wo.exercises.main.slice(0,3).map((e,j) => <div key={j} style={{ marginTop: 2 }}>• {e.name} — {e.sets}×{e.reps}{e.suggestedWeight ? ` @ ${e.suggestedWeight}` : ""}</div>)}
                {wo.exercises.main.length > 3 && <div style={{ marginTop: 2 }}>+ {wo.exercises.main.length - 3} more</div>}
              </div>}
            </div>
          );
        })}
        <button onClick={() => setShowBonus(true)} style={{ ...btn, background: C.sf, border: `1px dashed ${C.br}`, color: C.td, width: "100%", padding: 14, borderRadius: 8, marginTop: 4, fontSize: 13 }}>+ Add Bonus Workout</button>
        {showBonus && <div style={{ ...card, borderLeft: `3px solid ${C.yl}`, marginTop: 8 }}>
          <div style={{ fontSize: 14, fontWeight: 600, marginBottom: 6 }}>Bonus Session</div>
          <div style={{ fontSize: 12, color: C.td, marginBottom: 12 }}>Light recovery + skill work.</div>
          <button onClick={startBonus} style={{ ...btn, background: C.yl, color: "#000", fontWeight: 600, padding: "10px 16px", borderRadius: 6, fontSize: 13 }}>Start Bonus</button>
        </div>}
      </div>
    );
  }

  // ─── DASHBOARD ───
  const dow = new Date().getDay();
  let sd = 0;
  if (dow >= 1 && dow <= 3) sd = dow - 1;
  else if (dow === 0 || dow >= 4) sd = 3;
  const dd = SCHEDULE.map((_,i) => state.completedWorkouts[`w${week}-d${i}`]);
  const ds = SCHEDULE.map((_,i) => state.skippedWorkouts?.[`w${week}-d${i}`]);
  if (dd[sd] || ds[sd]) { const n = SCHEDULE.findIndex((_,i) => !dd[i] && !ds[i]); if (n >= 0) sd = n; }
  const tw = getWorkout(sd, week);
  const cc = dd.filter(Boolean).length;
  const isCal = state.athleteData.calibratedWeights && Object.values(state.athleteData.calibratedWeights).some(v => v !== null);

  return (
    <div style={{ padding: 16, maxWidth: 600, margin: "0 auto" }}>
      <div style={{ textAlign: "center", marginBottom: 20, paddingTop: 8 }}>
        <div style={{ fontSize: 11, textTransform: "uppercase", letterSpacing: 2, color: C.ac, fontWeight: 700 }}>Spartan Beast Trainer</div>
        <div style={{ fontSize: 28, fontWeight: 800, marginTop: 4 }}>{daysUntilRace()} days to race</div>
        <div style={{ fontSize: 12, color: C.td, marginTop: 4 }}>December 19, 2026 · Your first Beast</div>
      </div>

      {!isCal && <div onClick={() => setView("calibrate")} style={{ background: C.bd, border: `1px solid ${C.bl}44`, borderRadius: 10, padding: "12px 16px", marginBottom: 12, cursor: "pointer" }}>
        <div style={{ fontSize: 14, fontWeight: 700, color: C.bl }}>⚙ Calibrate Your Weights</div>
        <div style={{ fontSize: 12, color: C.td, marginTop: 4 }}>Tap here to set your working weights.</div>
      </div>}

      <div style={{ ...card, border: `1px solid ${C.br}` }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
          <div><div style={{ fontSize: 17, fontWeight: 700 }}>{phase.name} Phase</div><div style={{ fontSize: 12, color: C.td, marginTop: 2 }}>Week {week} of {TOTAL_WEEKS} · {weekDateRange(week)}{deload ? " · DELOAD" : ""}</div></div>
          <div style={{ textAlign: "right" }}><div style={{ fontSize: 22, fontWeight: 700, color: C.ac }}>{cc}/4</div><div style={{ fontSize: 10, color: C.td }}>this week</div></div>
        </div>
        <div style={{ marginTop: 10, height: 4, background: C.br, borderRadius: 2, overflow: "hidden" }}>
          <div style={{ height: "100%", width: `${Math.min(100,(week/TOTAL_WEEKS)*100)}%`, background: `linear-gradient(90deg,${C.ac},${C.gn})`, borderRadius: 2 }}/>
        </div>
        <div style={{ display: "flex", justifyContent: "space-between", marginTop: 4, fontSize: 10, color: C.td }}><span>Base</span><span>Build</span><span>Peak</span><span>Taper</span></div>
      </div>

      <div style={{ background: C.bg, borderRadius: 8, padding: 4, marginBottom: 12, display: "flex", border: `1px solid ${C.br}` }}>
        <button onClick={() => setEq("full")} style={{ ...btn, flex: 1, padding: 10, borderRadius: 6, fontSize: 13, fontWeight: 600, background: eq==="full"?C.ac:"transparent", color: eq==="full"?"#fff":C.td }}>🏋️ Full Gym</button>
        <button onClick={() => setEq("minimal")} style={{ ...btn, flex: 1, padding: 10, borderRadius: 6, fontSize: 13, fontWeight: 600, background: eq==="minimal"?C.ac:"transparent", color: eq==="minimal"?"#fff":C.td }}>✈️ Hotel / BW</button>
      </div>

      <div style={{ display: "flex", gap: 8, marginBottom: 12 }}>
        <div style={{ flex: 1, ...card }}><div style={{ fontSize: 10, color: C.td, textTransform: "uppercase" }}>Pull-Ups</div>
          <div style={{ display: "flex", alignItems: "baseline", gap: 4, marginTop: 4 }}><span style={{ fontSize: 24, fontWeight: 800, color: C.gn }}>{state.athleteData.maxPullUps}</span><span style={{ fontSize: 12, color: C.td }}>/ 10</span></div>
          <div style={{ marginTop: 6, height: 3, background: C.br, borderRadius: 2, overflow: "hidden" }}><div style={{ height: "100%", width: `${Math.min(100,(state.athleteData.maxPullUps/10)*100)}%`, background: C.gn, borderRadius: 2 }}/></div>
        </div>
        <div style={{ flex: 1, ...card }}><div style={{ fontSize: 10, color: C.td, textTransform: "uppercase" }}>Push-Ups</div>
          <div style={{ display: "flex", alignItems: "baseline", gap: 4, marginTop: 4 }}><span style={{ fontSize: 24, fontWeight: 800, color: C.gn }}>{state.athleteData.maxPushUps}</span><span style={{ fontSize: 12, color: C.td }}>/ 30</span></div>
          <div style={{ marginTop: 6, height: 3, background: C.br, borderRadius: 2, overflow: "hidden" }}><div style={{ height: "100%", width: `${Math.min(100,(state.athleteData.maxPushUps/30)*100)}%`, background: C.gn, borderRadius: 2 }}/></div>
        </div>
      </div>

      {completedToday && <div style={{ background: C.gd, border: `1px solid ${C.gn}33`, borderRadius: 8, padding: "10px 14px", marginBottom: 12, fontSize: 13, color: C.gn, fontWeight: 600 }}>✓ Completed: {completedToday}</div>}

      {tw && !dd[sd] && !ds[sd] && (
        <div style={{ ...card, border: `1px solid ${C.ac}44` }}>
          <div style={{ fontSize: 10, color: C.ac, textTransform: "uppercase", letterSpacing: 1, fontWeight: 600 }}>Up Next</div>
          <div style={{ fontSize: 18, fontWeight: 700, marginTop: 4 }}>{tw.label}</div>
          <div style={{ fontSize: 11, color: C.td, marginTop: 2 }}>{tw.day} · {eq==="full"?"Full Gym":"Travel"} · ~{sd===3?"90":"50"} min</div>
          <div style={{ margin: "10px 0 12px" }}>
            {tw.exercises.main.slice(0,4).map((e,i) => (
              <div key={i} style={{ display: "flex", justifyContent: "space-between", padding: "6px 0", borderBottom: i<3?`1px solid ${C.br}`:"none", fontSize: 13 }}>
                <span>{e.name}</span>
                <span style={{ color: e.suggestedWeight?C.bl:C.td, fontSize: 12, fontWeight: e.suggestedWeight?600:400 }}>{e.suggestedWeight || `${e.sets}×${e.reps}`}</span>
              </div>
            ))}
            {tw.exercises.main.length > 4 && <div style={{ fontSize: 12, color: C.td, marginTop: 4 }}>+ {tw.exercises.main.length-4} more</div>}
          </div>
          <button onClick={() => startWorkout(sd)} style={{ ...btn, background: C.ac, color: "#fff", fontWeight: 700, width: "100%", padding: 13, borderRadius: 8, fontSize: 14 }}>Start Workout</button>
        </div>
      )}

      <div style={{ display: "flex", gap: 8, marginBottom: 12 }}>
        <button onClick={() => setView("week")} style={{ ...btn, flex: 1, background: C.sf, color: C.tx, padding: 12, borderRadius: 8, border: `1px solid ${C.br}`, fontSize: 13, fontWeight: 600 }}>View Full Week</button>
        <button onClick={() => { setView("week"); setShowBonus(true); }} style={{ ...btn, flex: 1, background: C.sf, color: C.yl, padding: 12, borderRadius: 8, border: `1px solid ${C.br}`, fontSize: 13, fontWeight: 600 }}>+ Bonus Workout</button>
      </div>

      <div style={{ ...card }}>
        <div style={{ fontSize: 12, fontWeight: 600, marginBottom: 10, color: C.td, textTransform: "uppercase" }}>This Week</div>
        {SCHEDULE.map((s, i) => {
          const d = dd[i], sk = ds[i];
          return (
            <div key={i} style={{ display: "flex", alignItems: "center", gap: 10, padding: "8px 0", borderBottom: i<3?`1px solid ${C.br}`:"none", cursor: !d&&!sk?"pointer":"default", opacity: sk?0.6:1 }} onClick={() => !d&&!sk&&startWorkout(i)}>
              <div style={{ width: 24, height: 24, borderRadius: "50%", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 12, fontWeight: 700, background: d?C.gd:sk?C.sf:C.ag, color: d?C.gn:sk?C.td:C.ac, border: `1.5px solid ${d?C.gn:sk?C.td:C.ac}44` }}>{d?"✓":sk?"–":i+1}</div>
              <div style={{ flex: 1 }}>
                <div style={{ fontSize: 13, fontWeight: d||sk?400:600, color: d||sk?C.td:C.tx }}>{s.label}</div>
                <div style={{ fontSize: 11, color: C.td }}>{s.day}{sk?` · Skipped (${sk.reason==="travel"?"Travel":sk.reason==="tired"?"Tired":sk.reason==="pain"?"Pain":"Life"})`:""}</div>
              </div>
              {!d && !sk && <div style={{ fontSize: 11, color: C.ac, fontWeight: 600 }}>START →</div>}
            </div>
          );
        })}
      </div>

      <div style={{ display: "flex", gap: 8, marginBottom: 12, marginTop: 12 }}>
        <div onClick={() => { setCalibrationWeights({}); setView("calibrate"); }} style={{ flex: 1, ...card, cursor: "pointer" }}>
          <div style={{ fontSize: 12, color: C.bl, fontWeight: 600 }}>⚙ {isCal ? "Recalibrate" : "Set Up"} Weights</div>
          <div style={{ fontSize: 11, color: C.td, marginTop: 2 }}>Update working weights</div>
        </div>
        <div style={{ flex: 1, ...card }}>
          <div style={{ fontSize: 12, color: C.td, fontWeight: 600 }}>{eq==="full"?"🏋️ Full Gym":"✈️ Travel Mode"}</div>
          <div style={{ fontSize: 11, color: C.td, marginTop: 2 }}>Toggle above to switch</div>
        </div>
      </div>

      <div style={card}>
        <div style={{ fontSize: 12, fontWeight: 600, marginBottom: 8, color: C.td, textTransform: "uppercase" }}>Athlete Profile</div>
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8, fontSize: 12 }}>
          <div><span style={{ color: C.td }}>Pull-Ups:</span> <span style={{ fontWeight: 600 }}>{state.athleteData.maxPullUps}</span></div>
          <div><span style={{ color: C.td }}>Push-Ups:</span> <span style={{ fontWeight: 600 }}>{state.athleteData.maxPushUps}</span></div>
          <div><span style={{ color: C.td }}>Z2 Pace:</span> <span style={{ fontWeight: 600 }}>{state.athleteData.z2Pace}/mi</span></div>
          <div><span style={{ color: C.td }}>Weight:</span> <span style={{ fontWeight: 600 }}>227 lbs</span></div>
        </div>
      </div>
    </div>
  );
}

ReactDOM.render(<App />, document.getElementById("root"));
</script>
</body>
</html>
